<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005c3b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml"><title>LoanTrack Demo</title><style>
:root{--green:#005c3b;--dark:#003c28;--lime:#b6d438;--gold:#f3b629;--paper:#f4f7f5;--ink:#14231d;--muted:#63726a;--line:#d6e1da;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:900px;margin:auto;background:#fff;min-height:100vh}.header{background:linear-gradient(130deg,var(--dark),var(--green));color:#fff;padding:20px 24px;display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:1.15rem;font-weight:800}.brand span{background:var(--lime);color:var(--dark);padding:5px 8px;border-radius:7px;margin-right:8px}.demo{font-size:.72rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;opacity:.84}.nav{display:flex;gap:10px;align-items:center;font-size:.85rem}.nav form{margin:0}.nav button{background:transparent;color:#fff;border:1px solid #ffffff78;border-radius:6px;padding:7px 10px;cursor:pointer}main{padding:22px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:15px}.eyebrow{color:var(--muted);font-weight:800;font-size:.72rem;letter-spacing:.4px;text-transform:uppercase}.title{font-size:1.35rem;font-weight:800;margin:5px 0}.sub{color:var(--muted);font-size:.88rem}.row{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.badge{background:#e6f2d1;color:var(--dark);font-weight:800;font-size:.77rem;padding:6px 9px;border-radius:50px}.bar{height:11px;background:#e3ebe5;border-radius:99px;overflow:hidden;margin:16px 0 7px}.bar span{display:block;background:linear-gradient(90deg,var(--lime),var(--green));height:100%;border-radius:99px}.bar-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}.steps{margin:20px 0 0;padding:0;list-style:none}.steps li{position:relative;padding:0 0 18px 35px}.steps li:before{content:"";position:absolute;left:8px;top:2px;width:12px;height:12px;border:2px solid #a6b5ac;border-radius:50%;background:#fff}.steps li:after{content:"";position:absolute;left:14px;top:17px;width:2px;height:23px;background:#d6e1da}.steps li:last-child:after{display:none}.steps .done:before{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px #fff}.steps .current:before{background:var(--lime);border-color:var(--green);box-shadow:0 0 0 4px #e6f2d1}.steps small{display:block;color:var(--muted);margin-top:3px;font-size:.8rem}.notice{padding:12px;border-radius:8px;background:#fff8df;border-left:4px solid var(--gold);line-height:1.45;font-size:.88rem}.flash{padding:11px;border-radius:8px;margin-bottom:15px;font-size:.88rem}.flash.error{background:#fce8e7;color:#8a1c14}.flash.success{background:#e6f2d1;color:var(--dark)}label{display:block;font-weight:700;font-size:.84rem;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #b8c9be;border-radius:7px}textarea{min-height:78px;resize:vertical}.button{display:inline-block;border:0;border-radius:8px;background:var(--green);color:#fff;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;margin-top:14px}.help{font-size:.82rem;color:var(--muted);line-height:1.45}.case{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:13px;margin:9px 0}.case:hover{border-color:var(--green);background:#f7fbf8}.split{display:grid;grid-template-columns:260px 1fr;gap:18px}@media(max-width:650px){.header{padding:18px}.demo{display:none}main{padding:16px}.split{grid-template-columns:1fr}.shell{min-height:100vh}.nav{font-size:.75rem}}
</style></head><body><div class="shell"><header class="header"><div class="brand"><span>↗</span>LoanTrack</div><div class="demo">Demo only · Fictional test data</div>{% if current_user() %}<div class="nav"><span>{{ current_user().display_name }}</span><form method="post" action="{{ url_for('logout') }}"><button>Sign out</button></form></div>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></div><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));}</script></body></html>
